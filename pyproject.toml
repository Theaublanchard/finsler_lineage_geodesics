[project]
name = "fingeo-supplement"
version = "0.1.0"
description = "Lineage-guided Finsler geometry for trajectory inference (paper supplement)."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "pytorch-lightning>=2.0",
    "torchmetrics>=1.0",
    "torchdyn>=1.0.6",
    "scikit-learn>=1.3",
    "scanpy>=1.9",
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "networkx>=3.0",
    "POT>=0.9",
    "geomloss>=0.2.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "matplotlib>=3.7",
    "wandb>=0.16",
    "ipywidgets>=8.0",
    "umap-learn>=0.5",
    "einops>=0.7",
    "torchcfm",
    "igraph>=1.0.0",
    "ipykernel>=7.4.0",
    "pykeops>=2.3",
    "litlogger>=2026.8.28",
    "lightning>=2.6.6",
]

[project.scripts]
fingeo-recover = "fingeo_supplement.scripts.recover:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingeo_supplement"]

[tool.hatch.build.targets.wheel.force-include]
configs = "fingeo_supplement/configs"

[tool.uv]

package = true

[tool.uv.sources]
torchcfm = { git = "https://github.com/atong01/conditional-flow-matching", tag = "1.0.7" }